name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unicos_ci
          POSTGRES_USER: unicos_ci
          POSTGRES_PASSWORD: unicos_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicos_ci -d unicos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      POSTGRES_DB: unicos_ci
      POSTGRES_USER: unicos_ci
      POSTGRES_PASSWORD: unicos_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Django checks
        run: python app/manage.py check

      - name: Check for missing migrations
        run: python app/manage.py makemigrations --check

      - name: Apply migrations
        run: python app/manage.py migrate --noinput

      - name: Run tests
        run: python app/manage.py test

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Docker environment file
        run: cp .env.example .env

      - name: Build Docker image
        run: docker compose build

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Run Django checks in container
        run: docker compose exec -T web python app/manage.py check

      - name: Check migrations in container
        run: docker compose exec -T web python app/manage.py makemigrations --check

      - name: Apply migrations in container
        run: docker compose exec -T web python app/manage.py migrate --noinput

      - name: Smoke test health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/healthz/; then
              exit 0
            fi
            echo "Waiting for web health endpoint... attempt ${i}/30"
            docker compose ps
            sleep 2
          done
          echo "Web health endpoint did not become ready."
          docker compose ps
          docker compose logs web --tail=200
          docker compose logs db --tail=100
          exit 1

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
