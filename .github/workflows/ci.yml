name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unicos_ci
          POSTGRES_USER: unicos_ci
          POSTGRES_PASSWORD: unicos_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicos_ci -d unicos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      POSTGRES_DB: unicos_ci
      POSTGRES_USER: unicos_ci
      POSTGRES_PASSWORD: unicos_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Django checks
        run: python app/manage.py check

      - name: Run tests
        run: python app/manage.py test
