services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicos}
      POSTGRES_USER: ${POSTGRES_USER:-unicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicos_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unicos} -d ${POSTGRES_DB:-unicos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
