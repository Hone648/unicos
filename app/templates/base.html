{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Unicos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/unicos.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{% url 'dashboard' %}">Unicos</a>
        {% if user.is_authenticated %}
          <nav class="nav">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'repair_orders:list' %}">Repair Orders</a>
          </nav>
          <div class="user-bar">
            <span>{{ user.get_username }}</span>
            <form class="logout-form" method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit">Log out</button>
            </form>
          </div>
        {% endif %}
      </div>
    </header>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message message-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
