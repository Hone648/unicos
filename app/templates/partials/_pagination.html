{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="button" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}">&larr; Previous</a>
  {% else %}
    <span class="button pagination-disabled">&larr; Previous</span>
  {% endif %}

  <span class="pagination-info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
    <a class="button" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}">Next &rarr;</a>
  {% else %}
    <span class="button pagination-disabled">Next &rarr;</span>
  {% endif %}
</nav>
{% endif %}
