{% extends "base.html" %}

{% block title %}Log in - Unicos{% endblock %}

{% block content %}
  <div class="login-card card">
    <h1>Log in</h1>
    {% if form.errors %}
      <p style="color:#742a2a;">Your username and password didn't match. Please try again.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
  </div>
{% endblock %}
